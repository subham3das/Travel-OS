<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApnaTrip - Discover. Connect. Travel.</title>

    <!-- Browser Favicons & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Meta / SEO -->
    <meta name="description" content="ApnaTrip - India's modern travel and tour departure booking platform. Discover authentic journeys and book verified departures." />
    <meta name="theme-color" content="#2563EB" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ApnaTrip" />
    <meta property="og:title" content="ApnaTrip - Discover. Connect. Travel." />
    <meta property="og:description" content="India's leading verified travel departures and curated vacation tours platform." />
    <meta property="og:image" content="/logo/logo-light.png" />
    <meta property="og:image:alt" content="ApnaTrip" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ApnaTrip - Discover. Connect. Travel." />
    <meta name="twitter:description" content="India's leading verified travel departures and curated vacation tours platform." />
    <meta name="twitter:image" content="/logo/logo-light.png" />
    <meta name="twitter:image:alt" content="ApnaTrip" />

    <!-- Structured Data (JSON-LD Organization Logo) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "ApnaTrip",
        "url": "https://apnatrip.com",
        "logo": "https://apnatrip.com/logo/logo-light.png",
        "image": "https://apnatrip.com/logo/logo-light.png",
        "description": "Discover, connect, and travel with verified packages and transparent bookings."
      }
    </script>

    <!-- Web Fonts & External SDKs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#F8F9FC] text-[#111827] antialiased selection:bg-[#FF4D6D] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
